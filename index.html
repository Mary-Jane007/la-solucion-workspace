<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>La-Solución Adviesbureau - Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Interne portal voor La-Solución Adviesbureau: opdrachten, klanten en afspraken georganiseerd op één plek."
    />
    <meta name="theme-color" content="#0f2547" />
    <script>
      (function () {
        try {
          var thema = localStorage.getItem("la-solucion-thema");
          document.documentElement.dataset.theme = thema === "licht" ? "licht" : "donker";
          if (thema === "licht") {
            document.documentElement.style.colorScheme = "light";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#f3f4f6");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #020b1a; color: #f9fafb; }
      html[data-theme="licht"] { background: #f3f4f6; color: #111827; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La-Solución" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root">
      <p style="padding: 24px; font-family: system-ui, sans-serif">La-Solución wordt geladen...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
